<!doctype html>

<head>

  <style>
    :root { color-scheme: light; --ink: #273c36; --paper: #fff9ea; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 36px 26px 24px; background: #e9ece4; color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
    .page { max-width: 1120px; margin: auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 20px; margin-bottom: 22px; }
    .brand { font-size: 15px; font-weight: 900; letter-spacing: -.4px; }
    .brand span { display: inline-grid; place-items: center; width: 27px; height: 27px; margin-right: 9px; border: 1.5px solid; border-radius: 50%; font-family: Georgia, serif; font-size: 19px; }
    .edition { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; }
    main { overflow: hidden; border: 1px solid #273c3638; border-radius: 5px; background: var(--paper); box-shadow: 0 15px 40px #263c3610; }
    .artwork { display: block; width: 100%; height: auto; }
    footer { display: flex; justify-content: space-between; gap: 18px; padding-top: 19px; font-size: 11px; line-height: 1.7; }
    footer p { margin: 0; }
    .credit { text-align: right; opacity: .65; }
    .spokes { animation: spin 2.5s linear infinite; }
    .rear-spokes { transform-origin: 350px 610px; }
    .front-spokes { transform-origin: 774px 610px; }
    .bell { animation: bell 5s ease-in-out infinite; transform-origin: 744px 380px; }
    .flight { animation: drift 6s ease-in-out infinite; }
    .flight.two { animation-delay: -2s; }
    .speed-line { animation: breeze 1.7s ease-in-out infinite; }
    .speed-line.delayed { animation-delay: -.8s; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bell { 0%, 84%, 100% { transform: rotate(0); } 88%, 94% { transform: rotate(7deg); } 91%, 97% { transform: rotate(-7deg); } }
    @keyframes drift { 50% { transform: translate(12px, -5px); } }
    @keyframes breeze { 50% { opacity: .3; transform: translateX(-14px); } }
    @media (prefers-reduced-motion: reduce) { .spokes, .bell, .flight, .speed-line { animation: none; } }
    @media (max-width: 600px) { body { padding: 18px 12px; } header { margin-bottom: 14px; } .edition { font-size: 8px; letter-spacing: 1px; } footer { font-size: 9px; } .brand { font-size: 12px; } }
  </style>
</head>

  <script>
    (() => {
      const motion = matchMedia('(prefers-reduced-motion: reduce)');
      const byId = id => document.getElementById(id);
      const leg = byId('near-leg');
      const outline = byId('near-leg-outline');
      const far = byId('far-leg');
      const farLight = byId('far-leg-light');
      const nearFoot = byId('near-foot');
      const farFoot = byId('far-foot');
      const nearPedal = byId('near-pedal');
      const farPedal = byId('far-pedal');
      const crank = byId('crank');
      let frame = 0;
      let previous = null;
      let phase = -Math.PI / 7;
      const n = value => value.toFixed(2);

      // A deliberately simple, illustrative leg bend: both feet stay on
      // opposite ends of the same crank, with the knees bending forward.
      function draw() {
        const x = 540 + Math.cos(phase) * 40;
        const y = 600 + Math.sin(phase) * 40;
        const fx = 1080 - x;
        const fy = 1200 - y;
        const nearPath = `M495 424 Q${n(x + 15)} 478 ${n(x)} ${n(y - 8)}`;
        const farPath = `M514 425 Q${n(fx + 53)} 496 ${n(fx)} ${n(fy - 8)}`;
        leg.setAttribute('d', nearPath);
        outline.setAttribute('d', nearPath);
        far.setAttribute('d', farPath);
        farLight.setAttribute('d', farPath);
        nearFoot.setAttribute('transform', `translate(${n(x)} ${n(y - 8)})`);
        farFoot.setAttribute('transform', `translate(${n(fx)} ${n(fy - 8)})`);
        nearPedal.setAttribute('d', `M${n(x - 13)} ${n(y)}h31`);
        farPedal.setAttribute('d', `M${n(fx - 13)} ${n(fy)}h29`);
        crank.setAttribute('transform', `rotate(${n(phase * 180 / Math.PI)} 540 600)`);
      }

      function tick(time) {
        if (previous !== null) phase += Math.min(time - previous, 60) / 2500 * Math.PI * 2;
        previous = time;
        draw();
        frame = requestAnimationFrame(tick);
      }

      function sync() {
        cancelAnimationFrame(frame);
        previous = null;
        draw();
        if (!motion.matches && !document.hidden) frame = requestAnimationFrame(tick);
      }
      motion.addEventListener('change', sync);
      document.addEventListener('visibilitychange', sync);
      sync();
    })();
  </script>
