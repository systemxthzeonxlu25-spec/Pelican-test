<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F1E5D0">
<title>鹈鹕的沿海骑行 · Pelican on Wheels</title>
<style>
  :root {
    --ink: #173a37;
    --coral: #e25a4c;
    --cream: #fbf3e2;
    --paper: #f1e5d0;
  }

  * { box-sizing: border-box; }

  html, body {
    width: 100%;
    min-height: 100%;
    margin: 0;
  }

  body {
    display: grid;
    place-items: center;
    overflow: hidden;
    background:
      radial-gradient(120% 90% at 50% 45%, #f8eedb 0%, #efe1c9 62%, #e7d5ba 100%);
    font-family: "Helvetica Neue", "Microsoft YaHei", Arial, sans-serif;
  }

  .stage {
    position: relative;
    width: 100vw;
    height: 100svh;
    overflow: hidden;
    background: #f1e5d0;
  }

  .stage::after {
    content: "";
    position: absolute;
    inset: clamp(8px, 1.2vw, 18px);
    border: 1px solid rgba(23, 58, 55, 0.17);
    pointer-events: none;
    z-index: 2;
  }

  svg#art {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* ---- Ambient loop layers ---- */
  .clouds-far { animation: cloudDrift 96s linear infinite; }
  .clouds-near { animation: cloudDrift 62s linear infinite; }
  .sea-drift { animation: seaDrift 18s linear infinite; }
  .wheel-spin {
    transform-box: fill-box;
    transform-origin: center;
    animation: wheelSpin 1.12s linear infinite;
  }
  .sun-glow {
    transform-box: fill-box;
    transform-origin: center;
    animation: sunPulse 7s ease-in-out infinite;
  }
  .sun-orbit {
    transform-box: fill-box;
    transform-origin: center;
    animation: wheelSpin 46s linear infinite;
  }
  .ground-speed {
    stroke-dashoffset: 0;
    animation: groundFlow 1.45s linear infinite;
  }
  .ground-speed.slow { animation-duration: 2.1s; }
  .chain {
    stroke-dasharray: 5 4;
    animation: chainFlow 1.05s linear infinite;
  }
  .gull {
    transform-box: fill-box;
    transform-origin: center;
    animation: gullBob 5.2s ease-in-out infinite;
  }
  .gull:nth-of-type(2) { animation-delay: -1.7s; animation-duration: 6.3s; }
  .gull:nth-of-type(3) { animation-delay: -3.1s; animation-duration: 4.7s; }
  .boat {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: boatBob 6.8s ease-in-out infinite;
  }
  .boat.late { animation-delay: -3.2s; animation-duration: 8.1s; }

  /* ---- Pelican motion ---- */
  .pelican-upper {
    transform-box: view-box;
    transform-origin: 527px 402px;
    animation: rideBob 1.7s ease-in-out infinite;
  }
  .head-look {
    transform-box: view-box;
    transform-origin: 632px 308px;
    animation: headLook 6.8s ease-in-out infinite;
  }
  .eye {
    transform-box: fill-box;
    transform-origin: center;
    animation: blink 6.4s infinite;
  }
  .pouch {
    transform-box: view-box;
    transform-origin: 703px 273px;
    animation: pouchJiggle 1.7s ease-in-out infinite;
  }
  .tail {
    transform-box: view-box;
    transform-origin: 494px 358px;
    animation: tailWag 3.4s ease-in-out infinite;
  }
  .fish-wiggle {
    transform-box: view-box;
    transform-origin: 846px 421px;
    animation: fishWiggle 2.4s ease-in-out infinite;
  }
  .fish-wiggle.late { animation-delay: -1.1s; animation-duration: 2.9s; }

  /* ---- Ground plants ---- */
  .sway {
    transform-box: fill-box;
    transform-origin: center bottom;
    animation: sway 4.8s ease-in-out infinite alternate;
  }
  .sway.delay-1 { animation-delay: -1.4s; animation-duration: 5.6s; }
  .sway.delay-2 { animation-delay: -3.2s; animation-duration: 4.3s; }
  .sway.delay-3 { animation-delay: -2.2s; animation-duration: 6.2s; }

  /* ---- Dust ---- */
  .dust circle {
    transform-box: fill-box;
    transform-origin: center;
    opacity: 0;
    animation: dustPuff 1.55s ease-out infinite;
  }
  .dust circle:nth-child(2) { animation-delay: -0.5s; }
  .dust circle:nth-child(3) { animation-delay: -1s; }
  .dust circle:nth-child(4) { animation-delay: -1.3s; }

  /* ---- Editorial cover ---- */
  .eyebrow {
    font-family: "Helvetica Neue", "Microsoft YaHei", Arial, sans-serif;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 2.6px;
    fill: #315a54;
  }
  .cover-title {
    font-family: "Bodoni MT", Didot, "Iowan Old Style", Georgia, "Times New Roman", serif;
    font-size: 76px;
    font-weight: 600;
    letter-spacing: -1.5px;
    fill: #163a37;
  }
  .cover-italic {
    font-family: "Bodoni MT", Didot, "Iowan Old Style", Georgia, "Times New Roman", serif;
    font-size: 48px;
    font-style: italic;
    font-weight: 500;
    letter-spacing: 0.2px;
    fill: #d9574a;
  }
  .cover-dek {
    font-family: "Helvetica Neue", "Microsoft YaHei", Arial, sans-serif;
    font-size: 12.5px;
    letter-spacing: 0.25px;
    fill: #3b5d57;
  }

  @keyframes cloudDrift { from { transform: translateX(0); } to { transform: translateX(-1200px); } }
  @keyframes seaDrift { from { transform: translateX(0); } to { transform: translateX(-600px); } }
  @keyframes wheelSpin { to { transform: rotate(360deg); } }
  @keyframes sunPulse {
    0%, 100% { opacity: .68; transform: scale(.96); }
    50% { opacity: 1; transform: scale(1.04); }
  }
  @keyframes groundFlow { to { stroke-dashoffset: -240; } }
  @keyframes chainFlow { to { stroke-dashoffset: -18; } }
  @keyframes gullBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(6px); }
  }
  @keyframes boatBob {
    0%, 100% { transform: translateY(0) rotate(-1.2deg); }
    50% { transform: translateY(3px) rotate(1deg); }
  }
  @keyframes rideBob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    22% { transform: translateY(-2.6px) rotate(-.55deg); }
    58% { transform: translateY(1.2px) rotate(.25deg); }
    80% { transform: translateY(-.8px) rotate(-.16deg); }
  }
  @keyframes headLook {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    35% { transform: translateY(-1px) rotate(-1.05deg); }
    68% { transform: translateY(1px) rotate(.55deg); }
  }
  @keyframes blink {
    0%, 91%, 95.4%, 100% { transform: scaleY(1); }
    93% { transform: scaleY(.05); }
  }
  @keyframes pouchJiggle {
    0%, 100% { transform: rotate(0deg) scaleY(1); }
    30% { transform: rotate(.55deg) scaleY(1.018); }
    65% { transform: rotate(-.25deg) scaleY(.993); }
  }
  @keyframes tailWag {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(-1.25deg); }
  }
  @keyframes fishWiggle {
    0%, 100% { transform: rotate(0deg); }
    35% { transform: rotate(4deg); }
    72% { transform: rotate(-3deg); }
  }
  @keyframes sway {
    from { transform: rotate(-1.25deg); }
    to { transform: rotate(1.45deg); }
  }
  @keyframes dustPuff {
    0% { opacity: 0; transform: translate(0, 0) scale(.35); }
    18% { opacity: .52; }
    100% { opacity: 0; transform: translate(-92px, -34px) scale(1.55); }
  }
  @media (prefers-reduced-motion: reduce) {
    .clouds-far, .clouds-near, .sea-drift, .wheel-spin, .sun-glow, .sun-orbit,
    .ground-speed, .chain, .gull, .boat, .pelican-upper, .head-look, .eye,
    .pouch, .tail, .fish-wiggle, .sway, .dust circle {
      animation: none !important;
    }
    .dust { display: none; }
  }

  @media (max-aspect-ratio: 1/1) {
    .stage::after { inset: 9px; }
  }
</style>
</head>

<script>
(() => {
  "use strict";

  const art = document.getElementById("art");
  if (!art) return;

  const el = {
    nearCrank: document.getElementById("nearCrank"),
    nearCrankInner: document.getElementById("nearCrankInner"),
    farCrank: document.getElementById("farCrank"),
    farCrankInner: document.getElementById("farCrankInner"),
    nearPedal: document.getElementById("nearPedal"),
    farPedal: document.getElementById("farPedal"),
    nearLegOutline: document.getElementById("nearLegOutline"),
    nearLeg: document.getElementById("nearLeg"),
    nearLegShine: document.getElementById("nearLegShine"),
    farLegOutline: document.getElementById("farLegOutline"),
    farLeg: document.getElementById("farLeg"),
    nearFoot: document.getElementById("nearFoot"),
    farFoot: document.getElementById("farFoot"),
    chainring: document.getElementById("chainring"),
    scarfTailBack: document.getElementById("scarfTailBack"),
    scarfTailFront: document.getElementById("scarfTailFront"),
    scarfDotsA: document.getElementById("scarfDotsA"),
    scarfDotsB: document.getElementById("scarfDotsB")
  };

  const BB = { x: 587, y: 545 };
  const CRANK = 36;
  const PERIOD = 1.7;
  const NEAR_HIP = { x: 541, y: 400 };
  const FAR_HIP = { x: 526, y: 392 };
  const THIGH = 108;
  const SHIN = 102;

  const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
  const round = (n) => Math.round(n * 100) / 100;

  function pedalAt(angle) {
    return {
      x: BB.x + Math.cos(angle) * CRANK,
      y: BB.y + Math.sin(angle) * CRANK
    };
  }

  function solveLeg(hip, ankle) {
    const dx = ankle.x - hip.x;
    const dy = ankle.y - hip.y;
    let d = Math.hypot(dx, dy);
    d = clamp(d, Math.abs(THIGH - SHIN) + 2, THIGH + SHIN - 1.2);
    const base = Math.atan2(dy, dx);
    const cosA = clamp((THIGH * THIGH + d * d - SHIN * SHIN) / (2 * THIGH * d), -1, 1);
    const a = Math.acos(cosA);
    const angle = base - a;
    return {
      x: hip.x + Math.cos(angle) * THIGH,
      y: hip.y + Math.sin(angle) * THIGH
    };
  }

  function legPath(hip, knee, ankle) {
    return `M${round(hip.x)} ${round(hip.y)} L${round(knee.x)} ${round(knee.y)} L${round(ankle.x)} ${round(ankle.y)}`;
  }

  function smoothPath(points) {
    if (!points.length) return "";
    if (points.length === 1) return `M${round(points[0].x)} ${round(points[0].y)}`;
    let d = `M${round(points[0].x)} ${round(points[0].y)}`;
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[i - 1] || points[i];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[i + 2] || p2;
      const c1x = p1.x + (p2.x - p0.x) / 6;
      const c1y = p1.y + (p2.y - p0.y) / 6;
      const c2x = p2.x - (p3.x - p1.x) / 6;
      const c2y = p2.y - (p3.y - p1.y) / 6;
      d += ` C${round(c1x)} ${round(c1y)} ${round(c2x)} ${round(c2y)} ${round(p2.x)} ${round(p2.y)}`;
    }
    return d;
  }

  function makeRibbon(ox, oy, length, phase, amplitude, rise, widthRoot) {
    const points = [];
    const count = 8;
    for (let i = 0; i <= count; i++) {
      const s = i / count;
      const lift = Math.pow(s, 0.72);
      const wave = Math.sin(phase + s * 7.2) * amplitude * (0.13 + 0.87 * s);
      const secondary = Math.sin(phase * 0.63 + s * 11.6) * amplitude * 0.18 * s;
      points.push({
        x: ox - length * s,
        y: oy - rise * lift + wave + secondary,
        w: widthRoot * (1 - 0.86 * s)
      });
    }

    const top = [];
    const bottom = [];
    const center = [];
    points.forEach((p, i) => {
      const prev = points[Math.max(0, i - 1)];
      const next = points[Math.min(points.length - 1, i + 1)];
      const tx = next.x - prev.x;
      const ty = next.y - prev.y;
      const mag = Math.hypot(tx, ty) || 1;
      const nx = -ty / mag;
      const ny = tx / mag;
      top.push({ x: p.x + nx * p.w * 0.5, y: p.y + ny * p.w * 0.5 });
      bottom.push({ x: p.x - nx * p.w * 0.5, y: p.y - ny * p.w * 0.5 });
      center.push({ x: p.x, y: p.y });
    });

    let d = smoothPath(top);
    const lastTop = top[top.length - 1];
    const lastBottom = bottom[bottom.length - 1];
    d += ` L${round(lastBottom.x)} ${round(lastBottom.y)}`;
    d += smoothPath(bottom.slice().reverse()).replace(/^M[^C]*/, "");
    d += " Z";

    return {
      fill: d,
      center: smoothPath(center)
    };
  }

  function draw(t) {
    const theta = Math.PI / 2 + (t * Math.PI * 2) / PERIOD;
    const farTheta = theta + Math.PI;
    const nearPedal = pedalAt(theta);
    const farPedal = pedalAt(farTheta);

    const nearAnkle = { x: nearPedal.x + 2, y: nearPedal.y - 10 };
    const farAnkle = { x: farPedal.x + 2, y: farPedal.y - 10 };
    const nearKnee = solveLeg(NEAR_HIP, nearAnkle);
    const farKnee = solveLeg(FAR_HIP, farAnkle);

    const nearD = legPath(NEAR_HIP, nearKnee, nearAnkle);
    const farD = legPath(FAR_HIP, farKnee, farAnkle);

    el.nearLegOutline.setAttribute("d", nearD);
    el.nearLeg.setAttribute("d", nearD);
    el.nearLegShine.setAttribute("d", nearD);
    el.farLegOutline.setAttribute("d", farD);
    el.farLeg.setAttribute("d", farD);

    el.nearCrank.setAttribute("d", `M${BB.x} ${BB.y} L${round(nearPedal.x)} ${round(nearPedal.y)}`);
    el.nearCrankInner.setAttribute("d", `M${BB.x} ${BB.y} L${round(nearPedal.x)} ${round(nearPedal.y)}`);
    el.farCrank.setAttribute("d", `M${BB.x} ${BB.y} L${round(farPedal.x)} ${round(farPedal.y)}`);
    el.farCrankInner.setAttribute("d", `M${BB.x} ${BB.y} L${round(farPedal.x)} ${round(farPedal.y)}`);

    el.nearPedal.setAttribute("transform", `translate(${round(nearPedal.x)} ${round(nearPedal.y)})`);
    el.farPedal.setAttribute("transform", `translate(${round(farPedal.x)} ${round(farPedal.y)})`);

    const nearTilt = -2 + Math.sin(theta) * 7;
    const farTilt = 1 + Math.sin(farTheta) * 5;
    el.nearFoot.setAttribute("transform", `translate(${round(nearAnkle.x)} ${round(nearAnkle.y)}) rotate(${round(nearTilt)})`);
    el.farFoot.setAttribute("transform", `translate(${round(farAnkle.x)} ${round(farAnkle.y)}) rotate(${round(farTilt)})`);

    const degrees = ((theta - Math.PI / 2) * 180) / Math.PI;
    el.chainring.setAttribute("transform", `rotate(${round(degrees)} 587 545)`);

    const scarfA = makeRibbon(612, 315, 154, t * 2.7, 10.5, 76, 18);
    const scarfB = makeRibbon(605, 322, 86, t * 2.7 + 1.6, 7, 32, 12.5);
    el.scarfTailBack.setAttribute("d", scarfA.fill);
    el.scarfDotsA.setAttribute("d", scarfA.center);
    el.scarfTailFront.setAttribute("d", scarfB.fill);
    el.scarfDotsB.setAttribute("d", scarfB.center);
  }

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
  let last = null;
  let elapsed = 0.72;
  let raf = 0;

  function tick(now) {
    if (last === null) last = now;
    const delta = Math.min((now - last) / 1000, 0.08);
    last = now;
    elapsed += delta;
    draw(elapsed);
    raf = requestAnimationFrame(tick);
  }

  function startRide() {
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
    if (reduceMotion.matches) {
      draw(elapsed);
      return;
    }
    last = null;
    raf = requestAnimationFrame(tick);
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      cancelAnimationFrame(raf);
      raf = 0;
    } else if (!reduceMotion.matches) {
      last = null;
      raf = requestAnimationFrame(tick);
    }
  });

  if (typeof reduceMotion.addEventListener === "function") {
    reduceMotion.addEventListener("change", startRide);
  }

  draw(elapsed);
  startRide();
})();
</script>
</body>
</html>
